<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>収集帖｜我的收藏紀錄</title>
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" sizes="512x512" href="icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="収集帖">
<meta name="theme-color" content="#fbdf7e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Serif+TC:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #fff6da;
    --paper-deep: #fbdf7e;
    --ink: #4a3a18;
    --ink-soft: #93803f;
    --vermillion: #ef7d2f;
    --vermillion-deep: #d4601c;
    --gold: #2f9e93;
    --line: rgba(90,70,20,0.16);
    --card: #fffaea;
    --shadow: 0 6px 18px rgba(150,110,20,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.55), transparent 55%),
      radial-gradient(circle at 92% 4%, rgba(255,255,255,0.6), transparent 40%),
      repeating-linear-gradient(90deg, rgba(90,70,20,0.03) 0 2px, transparent 2px 48px),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .disp{font-family:'Shippori Mincho','Noto Serif TC',serif;}

  header.app-head{padding:34px 20px 18px;text-align:center;position:relative;}
  header.app-head::after{content:"";display:block;width:120px;height:1px;margin:16px auto 0;background:linear-gradient(90deg, transparent, var(--gold), transparent);}
  .app-head .kanji-title{font-size:30px;font-weight:800;letter-spacing:.16em;color:var(--ink);display:inline-flex;align-items:center;gap:12px;}
  .app-head .kanji-title #app-title-text{cursor:pointer;border-bottom:2px dashed transparent;}
  .app-head .kanji-title #app-title-text:hover{border-bottom-color:var(--vermillion);}
  #app-title-input{font:inherit;font-weight:inherit;color:inherit;background:transparent;border:none;border-bottom:2px solid var(--vermillion);text-align:center;outline:none;}
  .app-head .seal-mark{width:38px;height:38px;border-radius:6px;border:2.5px solid var(--vermillion);color:var(--vermillion);display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;transform:rotate(-6deg);font-family:'Shippori Mincho','Noto Serif TC',serif;flex-shrink:0;}
  .app-head .sub{margin-top:6px;font-size:11px;letter-spacing:.32em;color:var(--ink-soft);text-transform:uppercase;}

  nav.tabs{display:flex;gap:8px;padding:0 14px;overflow-x:auto;scrollbar-width:none;max-width:920px;margin:0 auto;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{flex:0 0 auto;padding:10px 18px 12px;border:none;background:var(--card);border-radius:10px 10px 0 0;font-family:'Shippori Mincho','Noto Serif TC',serif;font-size:14.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;border:1px solid var(--line);border-bottom:none;position:relative;top:1px;letter-spacing:.04em;}
  nav.tabs button.active{color:var(--vermillion-deep);background:var(--paper-deep);box-shadow:0 -3px 8px rgba(150,110,20,0.10);}
  nav.tabs button.active::after{content:"";position:absolute; left:0; right:0; bottom:-1px; height:2px;background:var(--paper-deep);}
  @media(max-width:480px){
    nav.tabs{gap:3px;padding:0 8px;}
    nav.tabs button{padding:8px 6px 10px;font-size:12px;letter-spacing:0;border-radius:8px 8px 0 0;flex:1 1 0;text-align:center;}
  }

  main{max-width:920px;margin:0 auto;background:var(--paper-deep);border:1px solid var(--line);border-radius:0 4px 14px 14px;padding:22px 18px 30px;min-height:420px;}
  @media(min-width:600px){ main{padding:28px 30px 36px;} }

  section.panel{display:none;}
  section.panel.active{display:block;}

  .panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .panel-head h2{font-family:'Shippori Mincho','Noto Serif TC',serif;font-size:20px;margin:0 0 4px;color:var(--ink);}
  .panel-head .desc{font-size:12px;color:var(--ink-soft);}

  .rate-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .rate-num{font-family:'Shippori Mincho','Noto Serif TC',serif;font-size:26px;font-weight:800;color:var(--vermillion-deep);white-space:nowrap;}
  .rate-num span{font-size:13px;color:var(--ink-soft);font-weight:500;margin-left:2px;}
  .stamp-row{display:flex;flex-wrap:wrap;gap:5px;max-width:340px;}
  .stamp-dot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--vermillion);background:transparent;flex-shrink:0;}
  .stamp-dot.filled{background:radial-gradient(circle at 35% 30%, #f8a24a, var(--vermillion) 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15);}

  .add-form{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px;padding:12px;background:var(--card);border:1px dashed var(--line);border-radius:10px;align-items:center;}
  .add-form input[type=text], .add-form input[type=date]{flex:1 1 140px;padding:9px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:13.5px;color:var(--ink);min-width:100px;}
  .add-form select{padding:9px 8px;border-radius:7px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:13px;color:var(--ink);}
  .btn{border:none;border-radius:7px;padding:9px 16px;font-family:'Shippori Mincho','Noto Serif TC',serif;font-weight:700;font-size:13.5px;cursor:pointer;letter-spacing:.03em;}
  .btn-primary{background:var(--vermillion);color:#fff;}
  .btn-primary:hover{background:var(--vermillion-deep);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--vermillion);color:var(--vermillion-deep);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}

  ul.check-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
  ul.check-list li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;}
  .stamp-check{width:30px;height:30px;border-radius:50%;border:2px solid var(--vermillion);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;transition:background .15s;}
  .stamp-check.done{background:radial-gradient(circle at 35% 30%, #f8a24a, var(--vermillion) 70%);}
  .stamp-check.done::after{content:"済";font-family:'Shippori Mincho','Noto Serif TC',serif;color:#fffaf0;font-size:12px;font-weight:700;}
  .item-name{flex:1;font-size:14.5px;font-weight:500;}
  .item-date{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .item-date input{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-family:inherit;color:var(--ink-soft);background:#fff;width:120px;}
  .del-x{background:none;border:none;color:var(--ink-soft);font-size:15px;cursor:pointer;opacity:.5;padding:2px 4px;}
  .del-x:hover{opacity:1;color:var(--vermillion-deep);}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
  @media(max-width:560px){
    .card-grid{grid-template-columns:repeat(2, 1fr);gap:10px;}
    .item-card .body{padding:8px 9px 10px;gap:4px;}
    .item-card input.name-input{font-size:12.5px;}
    .field-row label{width:30px;font-size:9.5px;}
    .field-row input{font-size:10.5px;padding:3px 5px;}
  }
  .item-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .item-card .photo-wrap{position:relative;width:100%;aspect-ratio:1/1;background:repeating-linear-gradient(45deg, rgba(150,110,20,0.06) 0 10px, transparent 10px 20px),#ffe9ad;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;}
  .item-card .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-placeholder{font-size:11px;color:var(--ink-soft);text-align:center;padding:8px;font-family:'Shippori Mincho','Noto Serif TC',serif;}
  .item-card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;}
  .item-card .name-row{display:flex;align-items:center;gap:6px;}
  .item-card input.name-input{flex:1;border:none;background:transparent;font-weight:700;font-size:14px;font-family:'Shippori Mincho','Noto Serif TC',serif;color:var(--ink);padding:0;}
  .item-card input.location-input{border:none;background:transparent;font-size:11px;color:var(--ink-soft);padding:0;margin:-4px 0 2px;width:100%;}
  .collected-badge{position:absolute; top:8px; left:8px;width:34px;height:34px;border-radius:50%;border:2px solid var(--vermillion);background:rgba(245,239,225,0.9);display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho','Noto Serif TC',serif;font-size:11px;color:var(--vermillion-deep);font-weight:700;cursor:pointer;transform:rotate(-8deg);}
  .collected-badge.on{background:radial-gradient(circle at 35% 30%, #f8a24a, var(--vermillion) 70%);color:#fffaf0;}
  .field-row{display:flex;gap:6px;align-items:center;}
  .field-row label{font-size:10.5px;color:var(--ink-soft);flex-shrink:0;width:38px;}
  .field-row input{flex:1;border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:11.5px;font-family:inherit;color:var(--ink);background:#fff;}

  .subtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .subtabs button{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-family:'Shippori Mincho','Noto Serif TC',serif;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .subtabs button.active{background:var(--vermillion);border-color:var(--vermillion);color:#fff;}
  #toyoko-region-nav,#magnet-jp-region-nav{position:sticky;top:0;z-index:5;background:var(--paper-deep);padding:8px 0 10px;margin-bottom:6px;}
  #toyoko-region-nav button,#magnet-jp-region-nav button{padding:6px 12px;font-size:12px;}

  .region-block{margin-bottom:20px;}
  .region-title{font-size:12px;letter-spacing:.12em;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:10px;font-family:'Shippori Mincho','Noto Serif TC',serif;font-weight:700;display:flex;justify-content:space-between;}
  .pref-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .pref-tile{border-radius:20px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px;cursor:pointer;position:relative;padding:7px 14px;}
  .pref-tile.owned{border-color:var(--vermillion);}
  .pref-tile.selected{outline:2px solid var(--vermillion-deep);}
  .pref-tile .pname{font-size:12.5px;font-weight:700;font-family:'Shippori Mincho','Noto Serif TC',serif;color:var(--ink);}
  .pref-tile .mini-stamp{position:static;width:16px;height:16px;border-radius:50%;background:var(--vermillion);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fffaf0;font-weight:700;flex-shrink:0;}

  .other-list{display:flex;flex-direction:column;gap:8px;}
  .other-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;}
  .other-row .thumb{width:44px;height:44px;border-radius:7px;flex-shrink:0;overflow:hidden;background:#ffe9ad;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .other-row .thumb img{width:100%;height:100%;object-fit:cover;}
  .other-row .oname{flex:1;font-size:13.5px;font-weight:500;}

  .detail-panel{margin-top:18px;padding:16px;background:var(--card);border:1px solid var(--gold);border-radius:12px;}
  .detail-panel .detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .detail-panel .detail-head h3{font-family:'Shippori Mincho','Noto Serif TC',serif;font-size:17px;margin:0;color:var(--vermillion-deep);}
  .close-detail{background:none;border:none;font-size:15px;color:var(--ink-soft);cursor:pointer;}

  footer.app-foot{max-width:920px;margin:22px auto 0;padding:0 18px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
  .foot-btn{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);padding:9px 18px;border-radius:20px;font-family:'Shippori Mincho','Noto Serif TC',serif;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .foot-btn:hover{border-color:var(--vermillion);color:var(--vermillion-deep);}
  .status-msg{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:10px;min-height:16px;}

  .lightbox{position:fixed;inset:0;background:rgba(20,20,20,0.82);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:20px;gap:16px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:72vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .lightbox .close-lb{position:absolute;top:18px;right:22px;color:#fff;font-size:26px;background:none;border:none;cursor:pointer;}
  .lightbox-actions{display:flex;gap:10px;}
  .lb-btn{border:none;border-radius:20px;padding:10px 18px;font-family:'Shippori Mincho','Noto Serif TC',serif;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--card);color:var(--ink);}
  .lb-btn-danger{background:var(--vermillion);color:#fffaf0;}

  .empty-note{font-size:12.5px;color:var(--ink-soft);text-align:center;padding:24px 10px;font-family:'Shippori Mincho','Noto Serif TC',serif;}
  input[type=file]{display:none;}
</style>
</head>
<body>

<header class="app-head">
  <div class="kanji-title"><span class="seal-mark">集</span><span id="app-title-text" onclick="editAppTitle()" title="點擊修改標題">収集帖</span></div>
  <div class="sub">My Collection Journal</div>
</header>

<nav class="tabs" id="tabs">
  <button data-panel="goshuin" class="active">御翔印</button>
  <button data-panel="pokemon">寶可夢徽章</button>
  <button data-panel="toyoko">東橫Inn徽章</button>
  <button data-panel="magnet">各地磁鐵</button>
</nav>

<main>

  <section class="panel active" id="panel-goshuin">
    <div class="panel-head">
      <div><h2>JAL 御翔印</h2><div class="desc">全國就航空港，勾選完成並記錄日期</div></div>
      <div class="rate-box"><div class="rate-num" id="goshuin-rate">0/0<span>達成率</span></div></div>
    </div>
    <div id="goshuin-stamps" class="stamp-row" style="margin-bottom:14px;"></div>
    <div class="add-form">
      <input type="text" id="goshuin-new-name" placeholder="新增（如限定版／新開放空港）">
      <button class="btn btn-primary" onclick="addGoshuinCustom()">加入</button>
    </div>
    <div id="goshuin-list"></div>
  </section>

  <section class="panel" id="panel-pokemon">
    <div class="panel-head">
      <div><h2>寶可夢中心徽章</h2><div class="desc">每間分店都有專屬的「ロゴピンズ」限定別針，拍照記錄、填完成時間與來源備注</div></div>
      <div class="rate-box"><div class="rate-num" id="pokemon-rate">0/0<span>達成率</span></div></div>
    </div>
    <div id="pokemon-stamps" class="stamp-row" style="margin-bottom:14px;"></div>
    <div class="add-form">
      <input type="text" id="pokemon-new-name" placeholder="新增分店名稱（快閃店／新分店）">
      <input type="text" id="pokemon-new-location" placeholder="地點（選填）">
      <select id="pokemon-new-region"><option value="jp">日本</option><option value="os">海外</option></select>
      <button class="btn btn-primary" onclick="addPokemonCustom()">加入</button>
    </div>
    <div id="pokemon-list"></div>
  </section>

  <section class="panel" id="panel-toyoko">
    <div class="panel-head">
      <div><h2>東橫Inn ご当地GENKIバッジ</h2><div class="desc">都道府県別＋海外店全52種類徽章，拍照、勾選完成與備注購買分店</div></div>
      <div class="rate-box"><div class="rate-num" id="toyoko-rate">0/52<span>達成率</span></div></div>
    </div>
    <div id="toyoko-stamps" class="stamp-row" style="margin-bottom:14px;"></div>
    <div class="subtabs" id="toyoko-region-nav"></div>
    <div class="add-form">
      <input type="text" id="toyoko-new-name" placeholder="新增（如新推出的限定款）">
      <button class="btn btn-primary" onclick="addToyokoCustom()">加入</button>
    </div>
    <div id="toyoko-list"></div>
  </section>

  <section class="panel" id="panel-magnet">
    <div class="panel-head">
      <div><h2>各地磁鐵收藏</h2><div class="desc">點進地區資料夾，可上傳多張照片並記錄購買日期</div></div>
    </div>
    <div class="subtabs" id="magnet-subtabs">
      <button data-sub="jp" class="active">日本 47都道府県</button>
      <button data-sub="other">其他國家</button>
    </div>
    <div id="magnet-jp-panel">
      <div class="rate-box" id="magnet-jp-rate" style="margin-bottom:16px;"></div>
      <div class="subtabs" id="magnet-jp-region-nav"></div>
      <div id="magnet-jp-grid"></div>
    </div>
    <div id="magnet-other-panel" style="display:none;">
      <div class="add-form">
        <input type="text" id="other-new-name" placeholder="新增國家／城市資料夾，例如：法國 巴黎">
        <button class="btn btn-primary" onclick="addOtherFolder()">加入</button>
      </div>
      <div class="other-list" id="other-list"></div>
    </div>
  </section>

</main>

<footer class="app-foot">
  <button class="foot-btn" onclick="exportData()">⤴ 分享／匯出備份</button>
  <button class="foot-btn" onclick="document.getElementById('import-file').click()">⤒ 匯入備份</button>
  <input type="file" id="import-file" accept="application/json" onchange="importData(event)">
</footer>
<div class="status-msg" id="status-msg"></div>

<div class="lightbox" id="lightbox">
  <button class="close-lb" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="">
  <div class="lightbox-actions">
    <button class="lb-btn" onclick="lightboxReplacePhoto()">🔄 重新上傳</button>
    <button class="lb-btn lb-btn-danger" onclick="lightboxRemovePhoto()">🗑 刪除照片</button>
  </div>
</div>

 ["中部",[["niigata","新潟"],["toyama","富山"],["ishikawa","石川"],["fukui","福井"],["yamanashi","山梨"],["nagano","長野"],["gifu","岐阜"],["shizuoka","静岡"],["aichi","愛知"]]],

const GOSHUIN_AIRPORTS = [
 ["北海道",["新千歳空港","函館空港","旭川空港","女満別空港","釧路空港","帯広空港","丘珠空港","利尻空港","奥尻空港","根室中標津空港"]],
 ["東北",["青森空港","三沢空港","花巻空港","秋田空港","山形空港","仙台空港"]],

/* ================= Portable storage backend =================
   Uses Claude's built-in window.storage when running inside a Claude artifact.
   Falls back to a same-shaped IndexedDB adapter so the exact same app works
   standalone (e.g. hosted on GitHub Pages) with no backend required.
   Note: outside Claude, data is saved per-browser/device only (IndexedDB),
   not synced across devices — use Export/Import to move data between them. */
const idbStorage = (function(){
  let dbPromise = null;
  function getDB(){
    if(!dbPromise){
      dbPromise = new Promise((resolve,reject)=>{
        const req = indexedDB.open('goshuin-collection-db', 1);
        req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv'); };
        req.onsuccess = ()=> resolve(req.result);
        req.onerror = ()=> reject(req.error);
      });
    }
    return dbPromise;
  }
  return {
    async get(key){
      const db = await getDB();
      return new Promise((resolve,reject)=>{
        const req = db.transaction('kv','readonly').objectStore('kv').get(key);
        req.onsuccess = ()=> resolve(req.result===undefined ? null : {key, value:req.result});
        req.onerror = ()=> reject(req.error);
      });
    },
    async set(key, value){
      const db = await getDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction('kv','readwrite');
        tx.objectStore('kv').put(value, key);
        tx.oncomplete = ()=> resolve({key, value});
        tx.onerror = ()=> reject(tx.error);
      });
    },
    async delete(key){
      const db = await getDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction('kv','readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = ()=> resolve({key, deleted:true});
        tx.onerror = ()=> reject(tx.error);
      });
    }
  };
})();
const storageBackend = (typeof window.storage !== 'undefined' && window.storage) ? window.storage : idbStorage;
const todayStr = () => new Date().toISOString().slice(0,10);
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showStatus(msg){ const el=document.getElementById('status-msg'); el.textContent=msg; setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; },3500); }

/* ================= Storage ================= */
async function loadAll(){
  try{
    const listRes = await storageBackend.get('lists', false).catch(()=>null);
    if(listRes && listRes.value){ DB = Object.assign(DB, JSON.parse(listRes.value)); }
  }catch(e){ console.warn('load lists failed', e); }
  try{
    const idxRes = await storageBackend.get('photo-index', false).catch(()=>null);
    if(idxRes && idxRes.value){
      const keys = JSON.parse(idxRes.value);
      for(const k of keys){
        try{ const p = await storageBackend.get('photo:'+k, false); if(p && p.value) PHOTOS[k]=p.value; }catch(e){}
      }
    }
  }catch(e){ console.warn('load photos failed', e); }

  // migrate legacy prefecture-based toyoko data (previous version tracked hotel stays per prefecture)
  if(!DB.toyoko) DB.toyoko = [];
  if(DB.toyokoJp && typeof DB.toyokoJp === 'object'){
    const notesByPrefName = {};
    Object.keys(DB.toyokoJp).forEach(prefId=>{
      const items = DB.toyokoJp[prefId] || [];
      if(!items.length) return;
      const prefEntry = PREFS.flatMap(g=>g[1]).find(p=>p[0]===prefId);
      const prefName = prefEntry ? prefEntry[1] : null;
      if(prefName) notesByPrefName[prefName] = items.map(i=>i.name).join('、');
    });
    DB._migratedToyokoNotes = notesByPrefName;
    delete DB.toyokoJp;
  }
  delete DB.toyokoOther;

  // migrate magnet Japan from single {owned,photo} per prefecture to folder (array of items)
  if(!DB.magnetOtherFolders) DB.magnetOtherFolders = [];
  if(!DB.magnetOtherItems) DB.magnetOtherItems = {};
  if(DB.magnetJp && typeof DB.magnetJp === 'object' && !Array.isArray(DB.magnetJp)){
    const isOldFormat = Object.values(DB.magnetJp).some(v => v && typeof v === 'object' && !Array.isArray(v));
    if(isOldFormat){
      Object.keys(DB.magnetJp).forEach(prefId=>{
        const old = DB.magnetJp[prefId];
        const oldPhoto = PHOTOS['jp:'+prefId];
        if(old && (old.owned || oldPhoto)){
          const newId = uid();
          DB.magnetJp[prefId] = [{id:newId, doneDate:'', note:''}];
          if(oldPhoto){ PHOTOS['magjp:'+prefId+':'+newId] = oldPhoto; savePhoto('magjp:'+prefId+':'+newId, oldPhoto); deletePhoto('jp:'+prefId); }
        } else {
          DB.magnetJp[prefId] = [];
        }
      });
    }
  }
  // migrate magnet "other countries" from flat owned-list to folders with items
  if(Array.isArray(DB.magnetOther)){
    DB.magnetOther.forEach(old=>{
      DB.magnetOtherFolders.push({id: old.id, name: old.name});
      const oldPhoto = PHOTOS['other:'+old.id];
      if(old.owned || oldPhoto){
        const newId = uid();
        DB.magnetOtherItems[old.id] = [{id:newId, doneDate:'', note:''}];
        if(oldPhoto){ PHOTOS['magother:'+old.id+':'+newId] = oldPhoto; savePhoto('magother:'+old.id+':'+newId, oldPhoto); deletePhoto('other:'+old.id); }
      } else {
        DB.magnetOtherItems[old.id] = [];
      }
    });
    delete DB.magnetOther;
  }

  // migrate pokemon preset names from Japanese to Chinese (name + location)
  let pokemonRenamed = false;
  DB.pokemon.forEach(item=>{
    if(POKEMON_LEGACY_NAMES[item.name]){
      const [newName, loc] = POKEMON_LEGACY_NAMES[item.name];
      item.name = newName;
      if(!item.location) item.location = loc;
      pokemonRenamed = true;
    }
  });
  if(pokemonRenamed) await saveLists();

  // v4 patch: refresh Pokémon Center store list — remove the incorrect "New York"
  // entry (that store actually closed back in 2005) and add newly-opened stores
  // (satellite/outlet/airport shops) that weren't in the original preset.
  const seededV4 = await storageBackend.get('seeded-v4', false).catch(()=>null);
  if(!seededV4 || !seededV4.value){
    const nyItem = DB.pokemon.find(i=>i.name==='寶可夢中心 紐約');
    if(nyItem){
      DB.pokemon = DB.pokemon.filter(i=>i.id!==nyItem.id);
      const pk = 'pokemon:'+nyItem.id;
      if(PHOTOS[pk]) deletePhoto(pk);
    }
    const existingNames = new Set(DB.pokemon.map(i=>i.name));
    POKEMON_PRESET.forEach(([region,name,location])=>{
      if(!existingNames.has(name)){
        DB.pokemon.push({id:uid(), name, region, location, collected:false, doneDate:'', note:'', preset:true});
      }
    });
    await storageBackend.set('seeded-v4', '1', false).catch(()=>{});
    await saveLists();
  }

  // v5 patch: only full "ポケモンセンター" stores sell their own logo pin badge —
  // remove the smaller "ポケモンストア"/satellite entries (no badge exists there),
  // but keep any of them the user already logged data on (downgraded to custom).
  const seededV5 = await storageBackend.get('seeded-v5', false).catch(()=>null);
  if(!seededV5 || !seededV5.value){
    const confirmedNames = new Set(POKEMON_PRESET.map(([,name])=>name));
    DB.pokemon = DB.pokemon.filter(item=>{
      if(confirmedNames.has(item.name)) return true;
      if(!item.preset) return true;
      const hasData = item.collected || item.doneDate || item.note || PHOTOS['pokemon:'+item.id];
      if(hasData){ item.preset = false; return true; }
      return false;
    });
    await storageBackend.set('seeded-v5', '1', false).catch(()=>{});
    await saveLists();
  }

  // seed presets once (bump version when preset sets change)
  const seededRes = await storageBackend.get('seeded-v3', false).catch(()=>null);
  if(!seededRes || !seededRes.value){
    if(DB.goshuin.length===0){
      GOSHUIN_AIRPORTS.forEach(([region,names])=>{
        names.forEach(name=> DB.goshuin.push({id:uid(), name, done:false, doneDate:'', region, preset:true}));
      });
    }
    if(DB.pokemon.length===0){
      POKEMON_PRESET.forEach(([region,name,location])=> DB.pokemon.push({id:uid(), name, region, location, collected:false, doneDate:'', note:'', preset:true}));
    }
    if(DB.toyoko.length===0){
      const migratedNotes = DB._migratedToyokoNotes || {};
      TOYOKO_BADGES.forEach(([region,names])=>{
        names.forEach(name=>{
          const note = migratedNotes[name] || '';
          DB.toyoko.push({id:uid(), name, region, collected: !!note, doneDate: note?todayStr():'', note, preset:true});
        });
      });
    }
    delete DB._migratedToyokoNotes;
    await storageBackend.set('seeded-v3', '1', false).catch(()=>{});
    await saveLists();
  }
}

async function saveLists(){
  try{ await storageBackend.set('lists', JSON.stringify(DB), false); }
  catch(e){ showStatus('儲存失敗，請稍後再試'); }
}

async function savePhoto(key, dataUrl){
  PHOTOS[key] = dataUrl;
  try{
    await storageBackend.set('photo:'+key, dataUrl, false);
    const idxRes = await storageBackend.get('photo-index', false).catch(()=>null);
    let keys = idxRes && idxRes.value ? JSON.parse(idxRes.value) : [];
    if(!keys.includes(key)){ keys.push(key); await storageBackend.set('photo-index', JSON.stringify(keys), false); }
  }catch(e){ showStatus('照片儲存失敗（可能過大）'); }
}
async function deletePhoto(key){
  delete PHOTOS[key];
  try{
    await storageBackend.delete('photo:'+key, false).catch(()=>{});
    const idxRes = await storageBackend.get('photo-index', false).catch(()=>null);
    if(idxRes && idxRes.value){
      let keys = JSON.parse(idxRes.value).filter(k=>k!==key);
      await storageBackend.set('photo-index', JSON.stringify(keys), false);
    }
  }catch(e){}
}

/* ================= Image compression ================= */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e =>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 480;
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        // Prefer WebP (smaller at same visual quality); fall back to JPEG if the
        // browser silently ignores the webp request (spec says it may return PNG instead).
        let dataUrl = canvas.toDataURL('image/webp', 0.7);
        if(!dataUrl.startsWith('data:image/webp')){
          dataUrl = canvas.toDataURL('image/jpeg', 0.65);
        }
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function pickPhoto(onPicked){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange = async ()=>{
    if(!inp.files[0]) return;
    showStatus('處理照片中…');
    const dataUrl = await compressImage(inp.files[0]);
    await onPicked(dataUrl);
    showStatus('照片已儲存');
  };
  inp.click();
}

function addGoshuinCustom(){
  const input = document.getElementById('goshuin-new-name');
  const name = input.value.trim();
  if(!name) return;
  DB.goshuin.push({id:uid(), name, done:false, doneDate:'', region:'自訂／特別版', preset:false});
  input.value='';
  saveLists(); renderGoshuin();
}
function toggleGoshuin(id){
  const item = DB.goshuin.find(i=>i.id===id);
  item.done = !item.done;
  if(item.done && !item.doneDate) item.doneDate = todayStr();
  if(!item.done) item.doneDate='';
  saveLists(); renderGoshuin();
}
function setGoshuinDate(id, val){
  const item = DB.goshuin.find(i=>i.id===id);
  item.doneDate = val;
  if(val) item.done = true;
  saveLists(); renderGoshuin();
}
function removeGoshuin(id){
  if(!confirm('確定要刪除這個項目嗎？')) return;
  DB.goshuin = DB.goshuin.filter(i=>i.id!==id);
  saveLists(); renderGoshuin();
}
function renderGoshuin(){
  const list = DB.goshuin;
  const done = list.filter(i=>i.done).length;
  document.getElementById('goshuin-rate').innerHTML = done+'/'+list.length+'<span>達成率</span>';
  document.getElementById('goshuin-stamps').innerHTML = list.map(i=>'<div class="stamp-dot '+(i.done?'filled':'')+'"></div>').join('');

  const wrap = document.getElementById('goshuin-list');
  if(list.length===0){ wrap.innerHTML = '<div class="empty-note">尚未有項目</div>'; return; }
  const groups = {};
  list.forEach(item=>{ const r=item.region||'其他'; (groups[r]=groups[r]||[]).push(item); });
  const order = GOSHUIN_AIRPORTS.map(g=>g[0]).concat(['自訂／特別版']);
  let html='';
  order.forEach(region=>{
    if(!groups[region]) return;
    const items = groups[region];
    const rDone = items.filter(i=>i.done).length;
    html += '<div class="region-block"><div class="region-title"><span>'+region+'</span><span>'+rDone+'/'+items.length+'</span></div><ul class="check-list">';
    items.forEach(item=>{
      html += '<li><div class="stamp-check '+(item.done?'done':'')+'" onclick="toggleGoshuin(\''+item.id+'\')"></div>'
        + '<div class="item-name">'+escapeHtml(item.name)+'</div>'
        + '<div class="item-date"><input type="date" value="'+(item.doneDate||'')+'" onchange="setGoshuinDate(\''+item.id+'\', this.value)"></div>'
        + (item.preset ? '' : '<button class="del-x" onclick="removeGoshuin(\''+item.id+'\')">✕</button>')
        + '</li>';
    });
    html += '</ul></div>';
  });
  wrap.innerHTML = html;
}

/* ================= Export / Import ================= */
async function exportData(){
  showStatus('打包資料中…');
  const bundle = { db: DB, photos: PHOTOS, exportedAt: new Date().toISOString() };
  const jsonStr = JSON.stringify(bundle);
  const d = new Date();
  const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const filename = '収集帖備份_'+stamp+'.json';
  const blob = new Blob([jsonStr], {type:'application/json'});

  // Prefer the native share sheet (AirDrop / 存到「檔案」/ LINE 等), same as goshuin apps do.
  try{
    const file = new File([blob], filename, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename});
      showStatus('已開啟分享');
      return;
    }
  }catch(err){
    if(err && err.name === 'AbortError'){ showStatus(''); return; } // user cancelled the share sheet
    // otherwise fall through to the direct-download fallback below
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showStatus('已匯出備份檔案');
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    try{
      const bundle = JSON.parse(e.target.result);
      if(!bundle.db) throw new Error('格式錯誤');
      if(!confirm('匯入將會覆蓋目前的所有收藏紀錄，確定要繼續嗎？')) { evt.target.value=''; return; }
      showStatus('匯入中，請稍候…');
      DB = Object.assign({title:'収集帖',goshuin:[],pokemon:[],toyoko:[],magnetJp:{},magnetOtherFolders:[],magnetOtherItems:{}}, bundle.db);
      PHOTOS = bundle.photos || {};
      await saveLists();
      const keys = Object.keys(PHOTOS);
      for(const k of keys){ await storageBackend.set('photo:'+k, PHOTOS[k], false).catch(()=>{}); }
      await storageBackend.set('photo-index', JSON.stringify(keys), false).catch(()=>{});
      await storageBackend.set('seeded-v3', '1', false).catch(()=>{});
      renderAll();
      showStatus('匯入完成！');
    }catch(err){ alert('匯入失敗：檔案格式不正確'); }
    evt.target.value='';
  };
  reader.readAsText(file);
}

/* ================= App title (editable) ================= */
function renderAppTitle(){
  const title = DB.title || '収集帖';
  const el = document.getElementById('app-title-text');
  if(el) el.textContent = title;
  document.title = title + '｜我的收藏紀錄';

function editAppTitle(){
  const el = document.getElementById('app-title-text');
  if(!el) return;
  const current = DB.title || '収集帖';
  const input = document.createElement('input');
  input.type = 'text';
  input.id = 'app-title-input';
  input.value = current;
  input.maxLength = 20;
  input.style.width = Math.max(current.length, 4) + 'ch';
  input.style.fontSize = getComputedStyle(el).fontSize;
  el.replaceWith(input);
  input.focus(); input.select();
  const commit = ()=>{
    const val = input.value.trim() || '収集帖';
    DB.title = val;
    saveLists();
    const span = document.createElement('span');
    span.id = 'app-title-text';
    span.title = '點擊修改標題';
    span.onclick = editAppTitle;
    span.textContent = val;
    input.replaceWith(span);
    renderAppTitle();
  };
  input.addEventListener('blur', commit, {once:true});
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); input.blur(); } });
}

function renderAll(){
  renderAppTitle();
